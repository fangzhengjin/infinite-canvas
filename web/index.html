<!doctype html>
<html lang="zh-CN" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="一个无限画布创作工具" />
        <link rel="icon" href="/logo.svg" />
        <title>无限画布</title>
        <script>
            try {
                var q = new URLSearchParams(location.search).get("theme");
                var t = q === "light" || q === "dark" ? q : null;
                if (!t) {
                    var s = JSON.parse(localStorage.getItem("infinite-canvas:theme_store") || "{}");
                    t = s.state && s.state.theme === "light" ? "light" : "dark";
                }
                document.documentElement.classList.toggle("dark", t === "dark");
                document.documentElement.style.colorScheme = t;
            } catch (e) {
                console.warn("主题初始化失败，已回退为深色主题。", e);
                document.documentElement.classList.add("dark");
                document.documentElement.style.colorScheme = "dark";
            }
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <script src="/config.js"></script>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
